name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  # Verifies the public-clone experience: compass-health-agent is an OPTIONAL
  # dependency, so install, typecheck, tests, build, and the CLI must all work
  # without it (the compass-health profile is simply not registered).
  build:
    name: Node 22 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'schedule'

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke CLI
        run: node dist/cli/index.js --help

  # Integration with the private compass-health-agent sibling. Non-blocking:
  # it drifts red whenever the pinned branch lags the harness (e.g. new handlers
  # not yet pushed) and must not fail the public build.
  compass-health-integration:
    name: Compass Health integration (optional)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Compass Health Agent
        run: git clone --depth 1 --branch codex/pi-harness-alignment https://github.com/submerge12/compress_health_agent.git ../compass-health-agent

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build Compass Health Agent
        working-directory: ../compass-health-agent
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
          pnpm --version
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  worker-reviewer-eval:
    name: Worker-reviewer eval (DeepSeek)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Compass Health Agent
        run: git clone --depth 1 --branch codex/pi-harness-alignment https://github.com/submerge12/compress_health_agent.git ../compass-health-agent

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build Compass Health Agent
        working-directory: ../compass-health-agent
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
          pnpm --version
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install
        run: npm ci

      - name: Run eval
        run: npm run eval:worker-reviewer
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
