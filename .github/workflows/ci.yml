name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  # Verifies the public-clone experience: compass-health-agent is an OPTIONAL
  # dependency, so install, typecheck, tests, build, and the CLI must all work
  # without it (the compass-health profile is simply not registered).
  build:
    name: Node 22 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'schedule'

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke CLI
        run: node dist/cli/index.js --help

  # Integration with the compress_health_agent sibling. P0-1: this is now a
  # REQUIRED cross-repo gate — the health branches are pinned and the job
  # must pass. It also runs compass-health's Python contract tests so all
  # three target repos are verified in one matrix.
  compass-health-integration:
    name: Compass Health integration (required)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: compass
          POSTGRES_PASSWORD: compass
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U compass"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://compass:compass@localhost:5433/compass_health
      SECRET_KEY: ci-only-secret-key-min-32-chars-0a1b2c3d4e5f
      CHA_REF: fix/health-system-hardening

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Compass Health Agent (pinned branch)
        run: git clone --depth 1 --branch "$CHA_REF" https://github.com/submerge12/compress_health_agent.git ../compass-health-agent

      - name: Checkout compass-health (pinned branch)
        run: git clone --depth 1 --branch fix/health-system-hardening https://github.com/submerge12/compass-health.git ../compass-health

      - name: Create service databases
        run: |
          pg_isready -h localhost -p 5433 -U compass
          psql "postgres://compass:compass@localhost:5433/postgres" -c 'CREATE DATABASE compass_health' || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python contract tests (compass-health BFF/gate)
        working-directory: ../compass-health/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "bcrypt==4.0.1" pytest pytest-asyncio
          pytest tests/test_health_domain_bff.py tests/test_legacy_write_disabled.py -q

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build Compass Health Agent
        working-directory: ../compass-health-agent
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
          pnpm --version
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  worker-reviewer-eval:
    name: Worker-reviewer eval (DeepSeek)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Compass Health Agent
        run: git clone --depth 1 --branch fix/health-system-hardening https://github.com/submerge12/compress_health_agent.git ../compass-health-agent

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build Compass Health Agent
        working-directory: ../compass-health-agent
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
          pnpm --version
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install
        run: npm ci

      - name: Run eval
        run: npm run eval:worker-reviewer
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
